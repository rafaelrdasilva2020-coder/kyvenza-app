<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KYVENZA | Treino</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="icon" href="assets/icons/favicon.ico"/>
<link rel="apple-touch-icon" href="assets/icons/icon-180.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/kyvenza.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen pb-10">

  <header class="flex items-center gap-3 px-5 py-4 border-b border-white/5">
    <a href="home.html" class="text-xl">←</a>
    <span class="font-display font-bold text-lg gradient-text">KYVENZA</span>
  </header>

  <main class="px-5 pt-6">
    <div id="cabecalho-treino" class="mb-6">
      <p class="text-sm text-[#8b9284] font-mono">Carregando treino...</p>
    </div>

    <div id="tabs-dias" class="flex gap-2 mb-4 overflow-x-auto pb-1"></div>

    <div id="progresso-dia" class="mb-5">
      <div class="flex items-center justify-between mb-1.5">
        <span id="progresso-texto" class="font-mono text-xs text-[#8b9284]">0 de 0 concluídos</span>
      </div>
      <div class="progresso-trilho">
        <div id="progresso-barra" class="progresso-preenchido" style="width: 0%"></div>
      </div>
    </div>

    <div id="banner-dia-concluido" class="hidden mb-4 rounded-xl p-4 bg-[#0f1f0a] border border-[rgba(118,255,3,0.35)] text-center">
      <p class="font-display font-semibold text-[#76ff03]">🔥 Treino do dia concluído!</p>
    </div>

    <div id="lista-exercicios" class="space-y-4"></div>
  </main>

  <!-- Modal do player de vídeo -->
  <div id="modal-video" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
      <div class="flex justify-between items-center mb-3">
        <h3 id="modal-titulo" class="font-display font-semibold text-lg"></h3>
        <button onclick="fecharModal()" class="text-2xl leading-none">×</button>
      </div>
      <div class="aspect-video rounded-lg overflow-hidden neon-border-green" id="modal-video-container"></div>
    </div>
  </div>

<script src="js/supabase-client.js"></script>
<script>
  async function abrirModal(nomeExercicio, exercicioId, workoutxExerciseId, youtubeId) {
    document.getElementById("modal-titulo").textContent = nomeExercicio;
    const container = document.getElementById("modal-video-container");

    if (workoutxExerciseId) {
      container.innerHTML = `<div class="video-em-breve">CARREGANDO...</div>`;
      document.getElementById("modal-video").classList.remove("hidden");

      const { data: { session } } = await supabaseClient.auth.getSession();
      const urlProxy = `${SUPABASE_URL}/functions/v1/workoutx-gif-proxy?exercicio_id=${exercicioId}&token=${session.access_token}`;

      container.innerHTML = `<img class="w-full h-full object-cover" src="${urlProxy}" alt="${nomeExercicio}"/>`;
      return;
    }

    if (youtubeId) {
      container.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${youtubeId}?autoplay=1" title="${nomeExercicio}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    } else {
      container.innerHTML = `<div class="video-em-breve">VÍDEO EM BREVE</div>`;
    }
    document.getElementById("modal-video").classList.remove("hidden");
  }

  function fecharModal() {
    document.getElementById("modal-video").classList.add("hidden");
    document.getElementById("modal-video-container").innerHTML = "";
  }

  (async () => {
    const aluno = await protegerPaginaDoAluno();
    if (!aluno) return;

    const hoje = new Date();
    const mesReferencia = new Date(Date.UTC(hoje.getUTCFullYear(), hoje.getUTCMonth(), 1)).toISOString().slice(0, 10);

    const { data: treino } = await supabaseClient
      .from("treinos")
      .select("id, nome, foco, nivel")
      .eq("aluno_id", aluno.id)
      .eq("mes_referencia", mesReferencia)
      .maybeSingle();

    const cabecalho = document.getElementById("cabecalho-treino");
    const listaEl = document.getElementById("lista-exercicios");

    if (!treino) {
      cabecalho.innerHTML = `<p class="text-sm text-[#8b9284]">Você ainda não gerou o treino deste mês.</p>`;
      listaEl.innerHTML = `<a href="questionario.html" class="gradient-cta-hero font-display font-semibold py-2.5 px-5 rounded-lg inline-block">GERAR TREINO</a>`;
      return;
    }

    const { data: exercicios } = await supabaseClient
      .from("treino_exercicios")
      .select("id, nome_exercicio, series, reps, carga_sugerida, observacao, ordem, exercicio_id, dia_letra, dia_nome, dia_foco, dia_ordem, dia_duracao_estimada_min, exercicios(youtube_id, categoria, workoutx_exercise_id)")
      .eq("treino_id", treino.id)
      .order("dia_ordem", { ascending: true })
      .order("ordem", { ascending: true });

    if (!exercicios || exercicios.length === 0) {
      listaEl.innerHTML = `<p class="text-sm text-[#8b9284]">Nenhum exercício encontrado neste treino.</p>`;
      return;
    }

    const hojeData = new Date().toISOString().slice(0, 10);

    // Busca o que o aluno já concluiu HOJE, pra manter marcado mesmo
    // se ele sair e voltar na tela (e pra calcular o banner de dia concluído).
    const { data: execucoesHojeRaw } = await supabaseClient
      .from("execucoes_treino")
      .select("treino_exercicio_id, carga_real")
      .eq("aluno_id", aluno.id)
      .eq("data_execucao", hojeData);

    const execucoesHoje = new Map((execucoesHojeRaw || []).map(e => [e.treino_exercicio_id, e.carga_real]));

    async function marcarConcluido(treinoExercicioId, cargaReal) {
      const { error } = await supabaseClient
        .from("execucoes_treino")
        .upsert(
          {
            aluno_id: aluno.id,
            treino_exercicio_id: treinoExercicioId,
            data_execucao: hojeData,
            carga_real: cargaReal || null,
          },
          { onConflict: "aluno_id,treino_exercicio_id,data_execucao" }
        );
      if (error) {
        console.error("Erro ao marcar exercício concluído:", error);
        alert("Não foi possível salvar. Tente novamente.");
        return false;
      }
      execucoesHoje.set(treinoExercicioId, cargaReal || null);
      return true;
    }

    async function desmarcarConcluido(treinoExercicioId) {
      const { error } = await supabaseClient
        .from("execucoes_treino")
        .delete()
        .eq("aluno_id", aluno.id)
        .eq("treino_exercicio_id", treinoExercicioId)
        .eq("data_execucao", hojeData);
      if (error) {
        console.error("Erro ao desmarcar exercício:", error);
        return false;
      }
      execucoesHoje.delete(treinoExercicioId);
      return true;
    }

    // Agrupa os exercícios por dia (Treino A, B, C...), preservando a ordem
    // em que a IA organizou o split.
    const diasMap = new Map();
    for (const ex of exercicios) {
      const chave = ex.dia_letra || "ÚNICO";
      if (!diasMap.has(chave)) {
        diasMap.set(chave, {
          letra: ex.dia_letra || "",
          nome: ex.dia_nome || treino.nome,
          foco: ex.dia_foco || treino.foco,
          duracao: ex.dia_duracao_estimada_min,
          itens: [],
        });
      }
      diasMap.get(chave).itens.push(ex);
    }
    const dias = Array.from(diasMap.values());

    const tabsEl = document.getElementById("tabs-dias");
    let diaAtivo = 0;

    function renderizarTabs() {
      if (dias.length <= 1) {
        tabsEl.innerHTML = "";
        return;
      }
      tabsEl.innerHTML = dias.map((d, i) => `
        <button
          data-dia-idx="${i}"
          class="font-mono text-sm px-4 py-2 rounded-full border whitespace-nowrap transition-colors ${i === diaAtivo ? "bg-[#76ff03] text-black border-[#76ff03] font-semibold" : "border-[rgba(255,255,255,0.1)] text-[#8b9284]"}"
        >TREINO ${d.letra || i + 1}</button>
      `).join("");

      tabsEl.querySelectorAll("[data-dia-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          diaAtivo = Number(btn.getAttribute("data-dia-idx"));
          renderizarTabs();
          renderizarDia();
        });
      });
    }

    function renderizarDia() {
      const dia = dias[diaAtivo];
      const bannerEl = document.getElementById("banner-dia-concluido");

      cabecalho.innerHTML = `
        <div class="flex items-center gap-2 mb-1">
          <span class="font-mono text-xs bg-[#1a1a1a] border border-[rgba(118,255,3,0.3)] rounded-full px-2 py-0.5 text-[#76ff03]">AI OPTIMIZED</span>
        </div>
        <h1 class="font-display text-2xl font-bold">${dia.letra ? `Treino ${dia.letra} — ${dia.nome}` : treino.nome}</h1>
        <p class="text-sm text-[#8b9284]">${dia.foco || ""} • ${dia.duracao || "--"} min • ${treino.nivel || ""}</p>
      `;

      const totalConcluidos = dia.itens.filter(ex => execucoesHoje.has(ex.id)).length;
      const todosConcluidos = totalConcluidos === dia.itens.length;
      bannerEl.classList.toggle("hidden", !todosConcluidos);

      document.getElementById("progresso-texto").textContent = `${totalConcluidos} de ${dia.itens.length} concluídos`;
      document.getElementById("progresso-barra").style.width = `${dia.itens.length ? (totalConcluidos / dia.itens.length) * 100 : 0}%`;

      listaEl.innerHTML = dia.itens.map(ex => {
        const youtubeId = ex.exercicios?.youtube_id;
        const workoutxExerciseId = ex.exercicios?.workoutx_exercise_id;
        const concluido = execucoesHoje.has(ex.id);
        const cargaSalva = execucoesHoje.get(ex.id);
        const stats = `${ex.series || "--"}x${ex.reps || "--"}${ex.carga_sugerida ? ` · sugestão ${ex.carga_sugerida}` : ""}`;

        return `
          <div class="glass-card p-3.5 ${concluido ? "border border-[rgba(118,255,3,0.4)]" : ""}" data-card-id="${ex.id}">
            <div class="flex items-center gap-3">
              <button
                data-btn-concluir="${ex.id}"
                class="icone-circular ${concluido ? "check-animado" : ""} w-7 h-7 shrink-0 rounded-full ${concluido ? "bg-[#76ff03]" : "border border-[rgba(255,255,255,0.15)]"}"
                aria-label="Marcar como concluído"
              >${concluido ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17L4 12" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ""}</button>

              <div class="flex-1 min-w-0 cursor-pointer" onclick='abrirModal(${JSON.stringify(ex.nome_exercicio)}, ${JSON.stringify(ex.exercicio_id)}, ${workoutxExerciseId ? JSON.stringify(workoutxExerciseId) : null}, ${youtubeId ? `"${youtubeId}"` : null})'>
                <p class="font-display font-semibold text-base truncate ${concluido ? "text-[#8b9284]" : ""}">${ex.nome_exercicio}</p>
                <p class="font-mono text-xs text-[#8b9284] mt-0.5">${stats}</p>
              </div>

              <div class="icone-circular w-8 h-8 shrink-0 rounded-full border border-[rgba(255,255,255,0.1)] cursor-pointer" onclick='abrirModal(${JSON.stringify(ex.nome_exercicio)}, ${JSON.stringify(ex.exercicio_id)}, ${workoutxExerciseId ? JSON.stringify(workoutxExerciseId) : null}, ${youtubeId ? `"${youtubeId}"` : null})'>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="#76ff03"><path d="M8 5v14l11-7z"/></svg>
              </div>
            </div>

            ${ex.observacao ? `
              <details class="mt-2 ml-10">
                <summary class="font-mono text-[11px] text-[#6b7166] cursor-pointer select-none">técnica</summary>
                <p class="text-xs text-[#8b9284] mt-1">${ex.observacao}</p>
              </details>
            ` : ""}

            <div class="mt-2.5 ml-10">
              <input
                type="text"
                data-input-carga="${ex.id}"
                placeholder="carga real (ex: 20kg)"
                value="${cargaSalva || ""}"
                class="w-full bg-transparent border-b border-[rgba(255,255,255,0.1)] py-1 text-xs font-mono text-[#f2f1ed] placeholder:text-[#6b7166] outline-none focus:border-[#76ff03]"
              />
            </div>
          </div>
        `;
      }).join("");

      // Liga os botões de concluir/desmarcar de cada card
      listaEl.querySelectorAll("[data-btn-concluir]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const treinoExercicioId = btn.getAttribute("data-btn-concluir");
          const jaConcluido = execucoesHoje.has(treinoExercicioId);
          btn.disabled = true;

          if (jaConcluido) {
            await desmarcarConcluido(treinoExercicioId);
          } else {
            const input = listaEl.querySelector(`[data-input-carga="${treinoExercicioId}"]`);
            await marcarConcluido(treinoExercicioId, input ? input.value.trim() : "");
          }

          renderizarDia();
        });
      });
    }

    renderizarTabs();
    renderizarDia();
  })();
</script>
</body>
</html>

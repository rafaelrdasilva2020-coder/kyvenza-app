<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KYVENZA | Treino</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="icon" href="assets/icons/favicon.ico"/>
<link rel="apple-touch-icon" href="assets/icons/icon-180.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/kyvenza.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .dot-serie {
    width: 8px; height: 8px; border-radius: 999px;
    background: rgba(255,255,255,0.15);
    transition: background-color 0.2s ease;
  }
  .dot-serie.feita { background: #76ff03; }
  .stepper-btn {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.12);
    color: #f2f1ed; font-size: 16px; user-select: none;
  }
  .stepper-btn:active { transform: scale(0.94); }
  .nav-icone { width: 20px; height: 20px; }
</style>
</head>
<body class="min-h-screen pb-24">

  <header class="flex items-center gap-3 px-5 py-4 border-b border-white/5">
    <a href="home.html" class="text-xl">←</a>
    <span class="font-display font-bold text-lg gradient-text">KYVENZA</span>
  </header>

  <main class="px-5 pt-6">
    <div id="cabecalho-treino" class="mb-5">
      <p class="text-sm text-[#8b9284] font-mono">Carregando treino...</p>
    </div>

    <div id="tabs-dias" class="flex gap-2 mb-4 overflow-x-auto pb-1"></div>

    <div id="banner-dia-concluido" class="hidden mb-4 rounded-xl p-4 bg-[#0f1f0a] border border-[rgba(118,255,3,0.35)] text-center">
      <p class="font-display font-semibold text-[#76ff03]">🔥 Treino do dia concluído!</p>
    </div>

    <div id="lista-exercicios" class="space-y-4"></div>
  </main>

  <!-- Modal do player de vídeo -->
  <div id="modal-video" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
      <div class="flex justify-between items-center mb-3">
        <h3 id="modal-titulo" class="font-display font-semibold text-lg"></h3>
        <button onclick="fecharModal()" class="text-2xl leading-none">×</button>
      </div>
      <div class="aspect-video rounded-lg overflow-hidden neon-border-green" id="modal-video-container"></div>
    </div>
  </div>

  <!-- Nav inferior com ícones -->
  <nav class="fixed bottom-0 left-0 right-0 flex justify-around py-3" style="background: var(--surface); border-top: 1px solid var(--border)">
    <a href="home.html" class="flex flex-col items-center gap-1 text-[10px] font-mono" style="color: var(--text-muted)">
      <svg class="nav-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
      HOME
    </a>
    <a href="questionario.html" class="flex flex-col items-center gap-1 text-[10px] font-mono" style="color: var(--text-muted)">
      <svg class="nav-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
      AI TRAINER
    </a>
    <a href="treino.html" class="flex flex-col items-center gap-1 text-[10px] font-mono" style="color: var(--accent)">
      <svg class="nav-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg>
      TREINO
    </a>
    <a href="evolucao.html" class="flex flex-col items-center gap-1 text-[10px] font-mono" style="color: var(--text-muted)">
      <svg class="nav-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      EVOLUÇÃO
    </a>
  </nav>

<script src="js/supabase-client.js"></script>
<script>
  const DESCANSO_PADRAO_SEGUNDOS = 60;

  async function abrirModal(nomeExercicio, exercicioId, workoutxExerciseId, youtubeId) {
    document.getElementById("modal-titulo").textContent = nomeExercicio;
    const container = document.getElementById("modal-video-container");

    // Prioridade: link manual do YouTube (escolhido de propósito pelo admin)
    // vale mais que o gif automático da WorkoutX. Só cai no gif se não
    // existir vídeo manual cadastrado pra esse exercício.
    if (youtubeId) {
      container.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${youtubeId}?autoplay=1" title="${nomeExercicio}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      document.getElementById("modal-video").classList.remove("hidden");
      return;
    }

    if (workoutxExerciseId) {
      container.innerHTML = `<div class="video-em-breve">CARREGANDO...</div>`;
      document.getElementById("modal-video").classList.remove("hidden");

      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        container.innerHTML = `<div class="video-em-breve">SESSÃO EXPIRADA</div>`;
        setTimeout(() => { window.location.href = "entrar.html"; }, 1500);
        return;
      }

      const urlProxy = `${SUPABASE_URL}/functions/v1/workoutx-gif-proxy?exercicio_id=${exercicioId}&token=${session.access_token}`;
      container.innerHTML = `<img class="w-full h-full object-cover" src="${urlProxy}" alt="${nomeExercicio}"/>`;
      return;
    }

    container.innerHTML = `<div class="video-em-breve">VÍDEO EM BREVE</div>`;
    document.getElementById("modal-video").classList.remove("hidden");
  }

  function fecharModal() {
    document.getElementById("modal-video").classList.add("hidden");
    document.getElementById("modal-video-container").innerHTML = "";
  }

  function formatarTempo(segundos) {
    const m = Math.floor(segundos / 60);
    const s = segundos % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  // Bip curto e discreto, gerado direto no navegador (sem precisar de
  // arquivo de áudio hospedado). Toca nos últimos 3 segundos do descanso.
  let audioCtx = null;
  function tocarBip() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const ganho = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      ganho.gain.setValueAtTime(0.15, audioCtx.currentTime);
      ganho.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
      osc.connect(ganho);
      ganho.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (err) {
      console.error("Não foi possível tocar o bip:", err);
    }
  }

  function extrairRepsAlvo(repsTexto) {
    const match = String(repsTexto || "10").match(/\d+/);
    return match ? parseInt(match[0], 10) : 10;
  }

  (async () => {
    const aluno = await protegerPaginaDoAluno();
    if (!aluno) return;

    const hoje = new Date();
    const mesReferencia = new Date(Date.UTC(hoje.getUTCFullYear(), hoje.getUTCMonth(), 1)).toISOString().slice(0, 10);
    const hojeData = new Date().toISOString().slice(0, 10);

    const { data: treino } = await supabaseClient
      .from("treinos")
      .select("id, nome, foco, nivel")
      .eq("aluno_id", aluno.id)
      .eq("mes_referencia", mesReferencia)
      .maybeSingle();

    const cabecalho = document.getElementById("cabecalho-treino");
    const listaEl = document.getElementById("lista-exercicios");

    if (!treino) {
      cabecalho.innerHTML = `<p class="text-sm text-[#8b9284]">Você ainda não gerou o treino deste mês.</p>`;
      listaEl.innerHTML = `<a href="questionario.html" class="gradient-cta-hero font-display font-semibold py-2.5 px-5 rounded-lg inline-block">MONTAR TREINO</a>`;
      return;
    }

    const { data: exercicios } = await supabaseClient
      .from("treino_exercicios")
      .select("id, nome_exercicio, series, reps, carga_sugerida, observacao, ordem, exercicio_id, dia_letra, dia_nome, dia_foco, dia_ordem, dia_duracao_estimada_min, exercicios(youtube_id, categoria, workoutx_exercise_id)")
      .eq("treino_id", treino.id)
      .order("dia_ordem", { ascending: true })
      .order("ordem", { ascending: true });

    if (!exercicios || exercicios.length === 0) {
      listaEl.innerHTML = `<p class="text-sm text-[#8b9284]">Nenhum exercício encontrado neste treino.</p>`;
      return;
    }

    // Busca as séries já registradas HOJE, pra manter o progresso se o
    // aluno sair e voltar na tela.
    const { data: seriesHojeRaw } = await supabaseClient
      .from("execucoes_series")
      .select("treino_exercicio_id, numero_serie, reps, carga")
      .eq("aluno_id", aluno.id)
      .eq("data_execucao", hojeData)
      .order("numero_serie", { ascending: true });

    // estado[treino_exercicio_id] = { series: [{numero_serie, reps, carga}], repsAtual, cargaAtual, descansando, descansoRestante, descansoTotal, timerId }
    const estado = {};
    for (const ex of exercicios) {
      const seriesDoExercicio = (seriesHojeRaw || []).filter(s => s.treino_exercicio_id === ex.id);
      estado[ex.id] = {
        series: seriesDoExercicio,
        repsAtual: extrairRepsAlvo(ex.reps),
        cargaAtual: "",
        descansando: false,
      };
    }

    function metaSeries(ex) {
      return parseInt(ex.series, 10) || 1;
    }

    function exercicioConcluido(ex) {
      return estado[ex.id].series.length >= metaSeries(ex);
    }

    async function registrarSerie(ex) {
      const s = estado[ex.id];
      const numeroSerie = s.series.length + 1;

      const { error } = await supabaseClient.from("execucoes_series").upsert(
        {
          aluno_id: aluno.id,
          treino_exercicio_id: ex.id,
          data_execucao: hojeData,
          numero_serie: numeroSerie,
          reps: s.repsAtual,
          carga: s.cargaAtual || null,
        },
        { onConflict: "aluno_id,treino_exercicio_id,data_execucao,numero_serie" }
      );

      if (error) {
        console.error("Erro ao registrar série:", error);
        alert("Não foi possível salvar essa série. Tente novamente.");
        return;
      }

      s.series.push({ numero_serie: numeroSerie, reps: s.repsAtual, carga: s.cargaAtual });
      s.cargaAtual = "";

      if (exercicioConcluido(ex)) {
        renderizarDia();
      } else {
        iniciarDescanso(ex);
      }
    }

    function iniciarDescanso(ex) {
      const s = estado[ex.id];
      s.descansando = true;
      s.descansoTotal = DESCANSO_PADRAO_SEGUNDOS;
      s.descansoRestante = DESCANSO_PADRAO_SEGUNDOS;
      renderizarDia();

      s.timerId = setInterval(() => {
        s.descansoRestante--;
        const textoEl = document.getElementById(`timer-texto-${ex.id}`);
        const barraEl = document.getElementById(`timer-barra-${ex.id}`);
        if (textoEl) textoEl.textContent = formatarTempo(s.descansoRestante);
        if (barraEl) barraEl.style.width = `${(s.descansoRestante / s.descansoTotal) * 100}%`;

        if (s.descansoRestante === 3 || s.descansoRestante === 2 || s.descansoRestante === 1) {
          tocarBip();
        }

        if (s.descansoRestante <= 0) {
          pararDescanso(ex);
        }
      }, 1000);
    }

    function pararDescanso(ex) {
      const s = estado[ex.id];
      clearInterval(s.timerId);
      s.descansando = false;
      renderizarDia();
    }

    // Agrupa os exercícios por dia (Treino A, B, C...)
    const diasMap = new Map();
    for (const ex of exercicios) {
      const chave = ex.dia_letra || "ÚNICO";
      if (!diasMap.has(chave)) {
        diasMap.set(chave, {
          letra: ex.dia_letra || "",
          nome: ex.dia_nome || treino.nome,
          foco: ex.dia_foco || treino.foco,
          duracao: ex.dia_duracao_estimada_min,
          itens: [],
        });
      }
      diasMap.get(chave).itens.push(ex);
    }
    const dias = Array.from(diasMap.values());

    const tabsEl = document.getElementById("tabs-dias");
    let diaAtivo = 0;

    function renderizarTabs() {
      if (dias.length <= 1) {
        tabsEl.innerHTML = "";
        return;
      }
      tabsEl.innerHTML = dias.map((d, i) => `
        <button
          data-dia-idx="${i}"
          class="font-mono text-sm px-4 py-2 rounded-full border whitespace-nowrap transition-colors ${i === diaAtivo ? "bg-[#76ff03] text-black border-[#76ff03] font-semibold" : "border-[rgba(255,255,255,0.1)] text-[#8b9284]"}"
        >TREINO ${d.letra || i + 1}</button>
      `).join("");

      tabsEl.querySelectorAll("[data-dia-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          diaAtivo = Number(btn.getAttribute("data-dia-idx"));
          renderizarTabs();
          renderizarDia();
        });
      });
    }

    function renderizarDia() {
      const dia = dias[diaAtivo];
      const bannerEl = document.getElementById("banner-dia-concluido");

      const totalConcluidos = dia.itens.filter(exercicioConcluido).length;
      const todosConcluidos = totalConcluidos === dia.itens.length;
      bannerEl.classList.toggle("hidden", !todosConcluidos);

      const circunferencia = 150.8;
      const offset = dia.itens.length ? circunferencia - (totalConcluidos / dia.itens.length) * circunferencia : circunferencia;

      cabecalho.innerHTML = `
        <div class="flex items-center justify-between">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="font-mono text-xs bg-[#1a1a1a] border border-[rgba(118,255,3,0.3)] rounded-full px-2 py-0.5 text-[#76ff03]">AI OPTIMIZED</span>
            </div>
            <h1 class="font-display text-xl font-bold">${dia.letra ? `Treino ${dia.letra} — ${dia.nome}` : treino.nome}</h1>
            <p class="text-sm text-[#8b9284]">${dia.foco || ""} • ${dia.duracao || "--"} min • ${treino.nivel || ""}</p>
          </div>
          <div class="relative w-14 h-14 shrink-0">
            <svg viewBox="0 0 56 56" class="w-14 h-14 -rotate-90">
              <circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5"/>
              <circle cx="28" cy="28" r="24" fill="none" stroke="#76ff03" stroke-width="5" stroke-linecap="round"
                stroke-dasharray="${circunferencia}" stroke-dashoffset="${offset}" style="transition: stroke-dashoffset 0.4s ease"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="font-mono text-[11px] font-semibold">${totalConcluidos}/${dia.itens.length}</span>
            </div>
          </div>
        </div>
      `;

      listaEl.innerHTML = dia.itens.map(ex => {
        const youtubeId = ex.exercicios?.youtube_id;
        const workoutxExerciseId = ex.exercicios?.workoutx_exercise_id;
        const s = estado[ex.id];
        const meta = metaSeries(ex);
        const abrirVideoArgs = `${JSON.stringify(ex.nome_exercicio)}, ${JSON.stringify(ex.exercicio_id)}, ${workoutxExerciseId ? JSON.stringify(workoutxExerciseId) : null}, ${youtubeId ? `"${youtubeId}"` : null}`;

        if (exercicioConcluido(ex)) {
          const resumo = s.series.map(se => `S${se.numero_serie}: ${se.reps}x ${se.carga || "livre"}`).join(" · ");
          return `
            <div class="glass-card p-4 border" style="border-color: rgba(118,255,3,0.4)">
              <div class="flex items-center justify-between">
                <div class="min-w-0 cursor-pointer" onclick='abrirModal(${abrirVideoArgs})'>
                  <p class="font-display font-semibold">${ex.nome_exercicio}</p>
                  <p class="text-xs mt-0.5 text-[#8b9284] truncate">${resumo}</p>
                </div>
                <div class="w-7 h-7 shrink-0 rounded-full flex items-center justify-center bg-[#76ff03] ml-3">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17L4 12" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
              </div>
            </div>
          `;
        }

        if (s.descansando) {
          return `
            <div class="glass-card p-4">
              <div class="flex items-center justify-between mb-3">
                <p class="font-display font-semibold text-base">${ex.nome_exercicio}</p>
                <span class="label-mono" style="color: var(--accent)">descanso</span>
              </div>
              <p id="timer-texto-${ex.id}" class="font-mono text-4xl font-bold text-center mb-3" style="color: var(--accent)">${formatarTempo(s.descansoRestante)}</p>
              <div class="progresso-trilho mb-3">
                <div id="timer-barra-${ex.id}" class="progresso-preenchido" style="width: 100%; transition: width 1s linear"></div>
              </div>
              <button data-pular-descanso="${ex.id}" class="w-full text-xs font-mono py-1.5 text-[#8b9284]">PULAR DESCANSO →</button>
            </div>
          `;
        }

        const dots = Array.from({ length: meta }, (_, i) => `<div class="dot-serie ${i < s.series.length ? "feita" : ""}"></div>`).join("");

        return `
          <div class="glass-card p-4">
            <div class="flex items-center justify-between mb-1">
              <div class="min-w-0 cursor-pointer" onclick='abrirModal(${abrirVideoArgs})'>
                <p class="font-display font-semibold text-base truncate">${ex.nome_exercicio}</p>
                <p class="font-mono text-xs mt-0.5 text-[#8b9284]">sugestão ${ex.carga_sugerida || "livre"}</p>
              </div>
              <div class="flex gap-1.5 shrink-0 ml-3">${dots}</div>
            </div>

            ${ex.observacao ? `
              <details class="mt-1 mb-2">
                <summary class="font-mono text-[11px] text-[#6b7166] cursor-pointer select-none">técnica</summary>
                <p class="text-xs text-[#8b9284] mt-1">${ex.observacao}</p>
              </details>
            ` : ""}

            <p class="label-mono mb-2 mt-2">SÉRIE ${s.series.length + 1} DE ${meta}</p>

            <div class="flex items-center gap-3 mb-3">
              <div class="flex items-center gap-2 flex-1">
                <button data-reps-menos="${ex.id}" class="stepper-btn">−</button>
                <div class="flex-1 text-center">
                  <p data-reps-valor="${ex.id}" class="font-mono text-lg font-semibold">${s.repsAtual}</p>
                  <p class="label-mono" style="font-size:9px">reps</p>
                </div>
                <button data-reps-mais="${ex.id}" class="stepper-btn">+</button>
              </div>
              <input
                type="text"
                data-input-carga="${ex.id}"
                placeholder="carga (kg)"
                value="${s.cargaAtual}"
                class="w-24 bg-transparent border-b text-center py-1 text-sm font-mono outline-none"
                style="border-color: var(--border); color: var(--text)"
              />
            </div>

            <button data-registrar="${ex.id}" class="w-full btn-primary font-display font-semibold py-2.5 rounded-lg text-sm">
              REGISTRAR SÉRIE
            </button>
          </div>
        `;
      }).join("");

      dia.itens.forEach(ex => {
        const s = estado[ex.id];

        const btnMais = listaEl.querySelector(`[data-reps-mais="${ex.id}"]`);
        const btnMenos = listaEl.querySelector(`[data-reps-menos="${ex.id}"]`);
        const valorEl = listaEl.querySelector(`[data-reps-valor="${ex.id}"]`);
        const inputCarga = listaEl.querySelector(`[data-input-carga="${ex.id}"]`);
        const btnRegistrar = listaEl.querySelector(`[data-registrar="${ex.id}"]`);
        const btnPular = listaEl.querySelector(`[data-pular-descanso="${ex.id}"]`);

        if (btnMais) btnMais.addEventListener("click", () => { s.repsAtual++; valorEl.textContent = s.repsAtual; });
        if (btnMenos) btnMenos.addEventListener("click", () => { s.repsAtual = Math.max(1, s.repsAtual - 1); valorEl.textContent = s.repsAtual; });
        if (inputCarga) inputCarga.addEventListener("input", (e) => { s.cargaAtual = e.target.value; });
        if (btnRegistrar) btnRegistrar.addEventListener("click", () => { btnRegistrar.disabled = true; registrarSerie(ex); });
        if (btnPular) btnPular.addEventListener("click", () => pararDescanso(ex));
      });
    }

    renderizarTabs();
    renderizarDia();
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyvenza — Treinos com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080a;
  --bg-elev:#0e100f;
  --bg-elev-2:#131715;
  --green:#7CFA3D;
  --green-dim:#4CAF2A;
  --cyan:#3FE0E8;
  --grad: linear-gradient(120deg, var(--green), var(--cyan));
  --text:#F2F5F0;
  --text-dim:#96A199;
  --text-dimmer:#5C665F;
  --border: rgba(124,250,61,0.14);
  --border-strong: rgba(124,250,61,0.3);
  --radius: 14px;
  --mono: 'JetBrains Mono', monospace;
  --display: 'Space Grotesk', sans-serif;
  --body: 'Inter', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:transparent;
  color:var(--text);
  font-family:var(--body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px;}
::selection{background:var(--green); color:#08110a;}
a:focus-visible, button:focus-visible{outline:2px solid var(--cyan); outline-offset:3px; border-radius:4px;}

/* ---------- NAV ---------- */
nav{
  position:fixed; top:0; left:0; right:0; z-index:50;
  backdrop-filter:blur(14px);
  background:rgba(7,8,10,0.72);
  border-bottom:1px solid rgba(124,250,61,0.08);
}
nav .wrap{display:flex; align-items:center; justify-content:space-between; height:68px;}
.logo{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:0.02em;}
.logo-mark{width:26px; height:26px; flex-shrink:0;}
.nav-pills{
  display:flex; align-items:center; gap:2px;
  background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
  border-radius:100px; padding:5px;
}
.nav-pills a{
  font-family:var(--mono); font-size:12px; letter-spacing:0.02em; color:var(--text-dim);
  text-decoration:none; padding:8px 16px; border-radius:100px; transition:all .18s ease;
}
.nav-pills a:hover{color:var(--text); background:rgba(255,255,255,0.06);}
.nav-cta{
  font-family:var(--mono); font-size:12.5px; letter-spacing:0.03em;
  color:#08110a; background:var(--green); border:none;
  padding:10px 18px; border-radius:8px; cursor:pointer;
  text-decoration:none; font-weight:600;
  transition:transform .15s ease, box-shadow .15s ease;
}
.nav-cta:hover{transform:translateY(-1px); box-shadow:0 6px 24px rgba(124,250,61,0.25);}
@media (max-width:900px){ .nav-pills{display:none;} }

/* ---------- EYEBROW ---------- */
.eyebrow{
  font-family:var(--mono); font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--green); display:inline-flex; align-items:center; gap:8px; margin-bottom:18px;
}
.eyebrow::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 12px var(--green);}

/* ---------- FUNDO FIXO (foto do atleta, cobre a página inteira, nunca some) ---------- */
.site-bg{ position:fixed; inset:0; z-index:-3; overflow:hidden; background:#050605; }
.site-bg-img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:75% 22%; display:block;
}
.site-bg-smoke{ position:fixed; inset:0; z-index:-2; pointer-events:none; overflow:hidden; }
.site-bg-smoke::before, .site-bg-smoke::after{
  content:''; position:absolute; border-radius:50%; filter:blur(90px); opacity:0.4;
  animation:smokeDrift 24s ease-in-out infinite alternate;
}
.site-bg-smoke::before{
  width:52vw; height:52vw; max-width:640px; max-height:640px;
  background:radial-gradient(circle, rgba(76,175,42,0.4) 0%, rgba(76,175,42,0) 68%);
  top:-10%; left:-12%;
}
.site-bg-smoke::after{
  width:44vw; height:44vw; max-width:540px; max-height:540px;
  background:radial-gradient(circle, rgba(63,224,232,0.32) 0%, rgba(63,224,232,0) 68%);
  bottom:-14%; right:-10%; animation-delay:-11s; animation-duration:29s;
}
@keyframes smokeDrift{ 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(4%,-5%) scale(1.14);} }
.site-bg-scrim{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    linear-gradient(100deg, rgba(5,6,5,0.88) 0%, rgba(5,6,5,0.62) 34%, rgba(5,6,5,0.3) 58%, rgba(5,6,5,0.5) 100%),
    linear-gradient(to bottom, rgba(5,6,5,0.55) 0%, rgba(5,6,5,0.1) 18%, rgba(5,6,5,0.15) 80%, rgba(5,6,5,0.7) 100%);
}
@media (prefers-reduced-motion: reduce){ .site-bg-smoke::before, .site-bg-smoke::after{ animation:none; } }

/* ---------- EFEITO SPECULAR (brilho na borda que segue o mouse, aplicado nos botões) ---------- */
.specular{ position:relative; isolation:isolate; }
.specular::before, .specular::after{
  content:''; position:absolute; inset:0; border-radius:inherit;
  padding:1px; pointer-events:none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.specular::after{
  background: rgba(255,255,255,0.16);
  z-index:1;
}
.specular::before{
  background: conic-gradient(
    from calc(var(--spec-ang, 0deg) - 45deg),
    transparent 0deg,
    transparent 55deg,
    rgba(255,255,255,0.95) 90deg,
    transparent 125deg,
    transparent 360deg
  );
  opacity: var(--spec-opacity, 0);
  z-index:2;
}
@media (prefers-reduced-motion: reduce){ .specular::before{ display:none; } }
@media (hover: none){ .specular::before{ display:none; } }

/* ---------- HERO ---------- */
.hero-stage{
  position:relative; min-height:100vh;
  display:flex; align-items:center; justify-content:flex-start;
  padding:120px 6vw 80px; text-align:left;
}
.hero-stage::before{
  content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(100deg, rgba(5,6,5,0.82) 0%, rgba(5,6,5,0.6) 30%, rgba(5,6,5,0.15) 55%, rgba(5,6,5,0) 72%);
}
.hero-copy{ max-width:560px; position:relative; z-index:3; }
.hero-copy h1{
  font-family:var(--display); font-weight:700;
  font-size:clamp(32px, 4.2vw, 56px); line-height:1.05; letter-spacing:-0.02em; margin-bottom:22px;
}
.hero-copy h1 .fw-light{ font-weight:400; color:var(--text-dim); }
.hero-copy h1 .accent{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero-copy p{ font-size:clamp(15px, 1.4vw, 17px); color:var(--text-dim); max-width:460px; margin:0 0 34px; }
.hero-btn-row{display:flex; align-items:center; justify-content:flex-start; gap:14px; flex-wrap:wrap;}
.btn-primary{
  display:inline-block; font-family:var(--mono); font-weight:600; font-size:14.5px;
  letter-spacing:0.02em; color:#08110a; background:var(--grad);
  padding:16px 30px; border-radius:10px; text-decoration:none; border:none; cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease;
}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 10px 32px rgba(124,250,61,0.28);}
.btn-ghost{
  display:inline-block; font-family:var(--mono); font-weight:600; font-size:14.5px;
  letter-spacing:0.02em; color:var(--text); background:transparent;
  padding:15px 28px; border-radius:10px; text-decoration:none; border:1px solid rgba(242,245,240,0.28);
  transition:border-color .18s ease, background .18s ease;
}
.btn-ghost:hover{border-color:rgba(242,245,240,0.55); background:rgba(242,245,240,0.05);}
.stat-row{ display:flex; align-items:center; justify-content:flex-start; gap:10px; margin-top:42px; flex-wrap:wrap; }
.stat-chip{
  background:rgba(255,255,255,0.04); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:10px 16px;
}
.chip-num{font-family:var(--display); font-size:15px; font-weight:700; color:var(--text); line-height:1.1;}
.chip-label{font-family:var(--mono); font-size:9px; color:var(--text-dim); letter-spacing:0.02em; margin-top:3px;}

@media (max-width:760px){
  .hero-stage{ justify-content:center; text-align:center; padding:120px 24px 70px; }
  .hero-stage::before{ background:linear-gradient(180deg, rgba(5,6,5,0.5) 0%, rgba(5,6,5,0.85) 60%, rgba(5,6,5,0.92) 100%); }
  .hero-copy{ max-width:100%; }
  .hero-copy p{ margin:0 auto 34px; }
  .hero-btn-row, .stat-row{ justify-content:center; }
}

/* ---------- TRUST ROW ---------- */
.trust-row{
  padding:36px 0 44px; border-bottom:1px solid var(--border);
}
.trust-row .wrap{display:flex; flex-wrap:wrap; gap:28px 44px;}
.trust-item{display:flex; align-items:flex-start; gap:10px; font-size:14px; color:var(--text-dim); max-width:260px;}
.trust-item svg{width:17px; height:17px; color:var(--green); flex-shrink:0; margin-top:2px;}

/* ---------- COMO FUNCIONA ---------- */
.steps-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
.step-card{background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; padding:30px 28px;}
.step-num{font-family:var(--display); font-weight:700; font-size:30px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:18px;}
.step-card h3{font-family:var(--display); font-size:17px; font-weight:600; margin-bottom:10px;}
.step-card p{font-size:14px; color:var(--text-dim); line-height:1.55;}
@media (max-width:860px){ .steps-grid{grid-template-columns:1fr;} }

/* ---------- SECTIONS SHARED ---------- */
section{position:relative; padding:110px 0;}
.section-head{max-width:640px; margin-bottom:56px;}
.section-head h2{ font-family:var(--display); font-weight:600; font-size:clamp(26px,3.6vw,38px); line-height:1.15; letter-spacing:-0.01em; }
.section-head p{color:var(--text-dim); font-size:16px; margin-top:14px; max-width:520px;}

/* ---------- BENEFITS ---------- */
.bento{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.bento-item{background:var(--bg-elev); padding:28px 24px; min-height:190px; display:flex; flex-direction:column; gap:14px;}
.bento-item .ico{width:30px; height:30px; color:var(--green);}
.bento-item h3{font-family:var(--display); font-size:16px; font-weight:600;}
.bento-item p{font-size:13px; color:var(--text-dim); line-height:1.55;}
@media (max-width:940px){ .bento{grid-template-columns:repeat(2,1fr);} }
@media (max-width:560px){ .bento{grid-template-columns:1fr;} }

/* ---------- APP SHOWCASE ---------- */
.app-demo{display:grid; grid-template-columns:0.85fr 1.15fr; gap:56px; align-items:center;}
.app-demo-text p{color:var(--text-dim); font-size:15.5px; margin-bottom:26px; max-width:440px;}
.app-demo-list{list-style:none; display:flex; flex-direction:column; gap:14px;}
.app-demo-list li{display:flex; align-items:center; gap:11px; font-size:14px; color:var(--text-dim);}
.app-demo-list svg{width:16px; height:16px; color:var(--cyan); flex-shrink:0;}
.phones-wrap{position:relative; display:flex; justify-content:center; gap:0;}
.phone-mock{
  width:230px; background:#050605; border:1px solid var(--border); border-radius:26px;
  padding:16px 14px; font-family:var(--mono); box-shadow:0 30px 70px -25px rgba(0,0,0,0.7);
}
.phone-mock.p2{ margin-left:-60px; margin-top:56px; }
@media (max-width:900px){
  .app-demo{grid-template-columns:1fr; gap:44px;}
  .phones-wrap{margin-top:10px;}
}
@media (max-width:560px){
  .phone-mock{width:180px;}
  .phone-mock.p2{margin-left:-46px; margin-top:70px;}
}

/* ---------- PRICING ---------- */
.pricing-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
.plan{ background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; padding:30px 26px; display:flex; flex-direction:column; position:relative; }
.plan.hi{border-color:var(--border-strong); background:linear-gradient(180deg, rgba(124,250,61,0.05), var(--bg-elev) 40%);}
.plan-badge{position:absolute; top:-11px; left:26px; font-family:var(--mono); font-size:10px; letter-spacing:0.06em; background:var(--green); color:#08110a; padding:4px 10px; border-radius:6px; font-weight:700;}
.plan-name{font-family:var(--mono); font-size:12.5px; letter-spacing:0.06em; color:var(--text-dim); text-transform:uppercase; margin-bottom:14px;}
.plan-price{font-family:var(--display); font-size:34px; font-weight:700; margin-bottom:2px;}
.plan-price span{font-size:14px; color:var(--text-dim); font-weight:500; font-family:var(--body);}
.plan-cycle{font-size:12.5px; color:var(--text-dimmer); margin-bottom:14px;}
.plan-trial{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; font-weight:600;
  color:var(--green); background:rgba(124,250,61,0.08); border:1px solid rgba(124,250,61,0.28);
  border-radius:6px; padding:5px 10px; margin-bottom:22px; width:fit-content;
}
.plan-feat{list-style:none; margin-bottom:26px; flex:1;}
.plan-feat li{font-size:13.5px; color:var(--text-dim); padding:7px 0; display:flex; gap:9px; align-items:flex-start; border-top:1px solid rgba(255,255,255,0.04);}
.plan-feat li:first-child{border-top:none;}
.plan-feat li::before{content:'✓'; color:var(--green); font-weight:700; flex-shrink:0;}
.plan-cta-group{display:flex; flex-direction:column; gap:10px;}
.plan-cta-label{font-family:var(--mono); font-size:10px; letter-spacing:0.04em; color:var(--text-dimmer); text-transform:uppercase;}
.plan-cta{
  display:block; text-align:center; font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:0.02em;
  padding:13px; border-radius:9px; text-decoration:none; cursor:pointer; border:1px solid var(--border-strong); color:var(--text);
  transition:all .15s ease;
}
.plan.hi .plan-cta.principal{background:var(--grad); color:#08110a; border:none;}
.plan-cta.principal{background:var(--grad); color:#08110a; border:none;}
.plan-cta.secundario{background:transparent; border:1px solid rgba(255,255,255,0.16); color:var(--text-dim); font-weight:500;}
.plan-cta:hover{transform:translateY(-1px);}
.pay-note{text-align:center; font-family:var(--mono); font-size:12px; color:var(--text-dimmer); margin-top:24px;}

/* ---------- ACCORDION ---------- */
.acc{ display:flex; flex-direction:column; gap:12px; }
.acc-item{
  background:rgba(255,255,255,0.045); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.12); border-radius:14px;
  overflow:hidden; transition:background .2s ease, border-color .2s ease;
}
.acc-item.open{ background:rgba(255,255,255,0.07); border-color:rgba(124,250,61,0.3); }
.acc-q{
  width:100%; text-align:left; background:none; border:none; color:var(--text); cursor:pointer;
  padding:20px 22px; display:flex; justify-content:space-between; align-items:center; gap:20px;
  font-family:var(--display); font-size:15.5px; font-weight:500;
}
.acc-q .plus{font-family:var(--mono); color:var(--green); font-size:18px; flex-shrink:0; transition:transform .25s ease;}
.acc-item.open .plus{transform:rotate(45deg);}
.acc-a{max-height:0; overflow:hidden; transition:max-height .3s ease;}
.acc-a p{padding:0 22px 20px; color:var(--text-dim); font-size:14px; line-height:1.6;}

/* ---------- GUARANTEE ---------- */
.guarantee{
  border:1px solid rgba(124,250,61,0.3); border-radius:20px; padding:52px 44px;
  background:rgba(255,255,255,0.05); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  display:flex; align-items:center; gap:40px;
}
.guarantee .g-ico{width:64px; height:64px; flex-shrink:0; color:var(--green);}
.guarantee h3{font-family:var(--display); font-size:22px; font-weight:600; margin-bottom:10px;}
.guarantee p{color:var(--text-dim); font-size:15px; max-width:560px;}

/* ---------- FINAL CTA ---------- */
.final-cta{text-align:center; padding:130px 0 100px;}
.final-cta h2{font-family:var(--display); font-weight:600; font-size:clamp(28px,4.4vw,46px); line-height:1.15; max-width:680px; margin:0 auto 20px;}
.final-cta p{color:var(--text-dim); font-size:16px; max-width:520px; margin:0 auto 34px;}
.ps-block{max-width:560px; margin:46px auto 0; padding-top:32px; border-top:1px solid var(--border); text-align:left;}
.ps-block p{font-size:13.5px; color:var(--text-dimmer); line-height:1.7;}
.ps-block b{color:var(--text-dim);}

/* ---------- AVISO LEGAL ---------- */
.aviso-legal{ padding:0 0 60px; }
.aviso-box{
  display:flex; gap:18px; align-items:flex-start;
  background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1);
  border-radius:14px; padding:26px 28px;
}
.aviso-ico{width:26px; height:26px; flex-shrink:0; color:var(--text-dimmer); margin-top:2px;}
.aviso-titulo{font-family:var(--display); font-weight:600; font-size:14px; color:var(--text-dim); margin-bottom:8px; letter-spacing:0.01em;}
.aviso-box p{font-size:12.5px; line-height:1.7; color:var(--text-dimmer); max-width:760px;}

footer{border-top:1px solid var(--border); padding:36px 0;}
footer .wrap{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;}
footer .logo{font-size:15px;}
footer .fine{font-family:var(--mono); font-size:11.5px; color:var(--text-dimmer);}

.reveal{opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;}
.reveal.in{opacity:1; transform:translateY(0);}

@media (max-width:860px){
  .pricing-grid{grid-template-columns:1fr;}
  .guarantee{flex-direction:column; text-align:center; padding:40px 26px;}
  .hero-stage{padding-top:100px;}
  .trust-row .wrap{flex-direction:column; gap:16px;}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
}

/* ---------- TRANSPARÊNCIA ---------- */
.trust-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:32px;}
.trust-card{background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; padding:28px 26px;}
.trust-card svg{width:26px; height:26px; color:var(--cyan); margin-bottom:16px;}
.trust-card h3{font-family:var(--display); font-size:16px; font-weight:600; margin-bottom:9px;}
.trust-card p{font-size:13.5px; color:var(--text-dim); line-height:1.55;}
.legal-links{font-size:13px; color:var(--text-dim); line-height:1.7;}
.legal-links a{color:var(--cyan); text-decoration:underline;}
@media (max-width:860px){ .trust-cards{grid-template-columns:1fr;} }

/* ---------- GLITCH HEADING ---------- */
.glitch-heading{
  position:relative; color:var(--text);
  text-shadow: -1.5px 0 rgba(255,60,80,0.5), 1.5px 0 rgba(63,224,232,0.5);
}

/* ---------- FOOTER ---------- */
.footer-grid{display:grid; grid-template-columns:1.3fr 1fr 1.3fr; gap:40px; padding:56px 0 32px;}
.footer-brand p{font-size:13px; color:var(--text-dim); line-height:1.6; margin-top:14px; max-width:280px;}
.footer-col h4{font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dimmer); margin-bottom:16px;}
.footer-col a{display:block; font-size:13.5px; color:var(--text-dim); text-decoration:none; margin-bottom:11px;}
.footer-col a:hover{color:var(--text);}
.footer-col p{font-size:12.5px; color:var(--text-dim); line-height:1.6; margin-bottom:14px;}
.footer-bottom{border-top:1px solid var(--border); padding:22px 0; font-family:var(--mono); font-size:11.5px; color:var(--text-dimmer);}
@media (max-width:760px){ .footer-grid{grid-template-columns:1fr; gap:32px;} }
</style>
</head>

<script>
window.SITE = {

  nav: {
    logo: "KYVENZA",
    cta: "Começar agora"
  },

  hero: {

    ctaPrimary: "Quero meu treino personalizado",
    ctaMicro: "A partir de R$ 39,90/mês · 7 dias grátis no cartão"
  },

  confianca: {
    itens: [

(function(){
  const PROXIMITY = 250;
  const SPEED = 0.35;

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const noHover = window.matchMedia('(hover: none)').matches;
  if(reduced || noHover) return;

  const buttons = document.querySelectorAll('.btn-primary, .nav-cta, .plan-cta.principal');
  const state = [];
  buttons.forEach(el=>{
    el.classList.add('specular');
    state.push({ el, ang: 0, op: 0 });
  });

  let mx = -9999, my = -9999;
  window.addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; }, {passive:true});
  window.addEventListener('mouseleave', function(){ mx = -9999; my = -9999; });

  function loop(){
    state.forEach(st=>{
      const r = st.el.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dx = mx - cx, dy = my - cy;
      const distToCenter = Math.hypot(dx, dy);
      const distToEdge = Math.max(0, distToCenter - Math.max(r.width, r.height)/2);
      const targetOp = distToEdge < PROXIMITY ? 1 - (distToEdge / PROXIMITY) : 0;
      const targetAng = Math.atan2(dy, dx) * 180 / Math.PI + 90;

      st.op += (targetOp - st.op) * SPEED;
      let diff = ((targetAng - st.ang + 540) % 360) - 180;
      st.ang += diff * SPEED;

      st.el.style.setProperty('--spec-opacity', Math.max(0, Math.min(1, st.op)).toFixed(3));
      st.el.style.setProperty('--spec-ang', st.ang.toFixed(1) + 'deg');
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

(function(){
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:0.14});
  els.forEach(el=>io.observe(el));
})();

document.addEventListener('click', function(e){
  const q = e.target.closest('.acc-q');
  if(!q) return;
  const item = q.closest('.acc-item');
  const a = item.querySelector('.acc-a');
  const isOpen = item.classList.contains('open');
  item.parentElement.querySelectorAll('.acc-item').forEach(i=>{
    i.classList.remove('open');
    i.querySelector('.acc-a').style.maxHeight = null;
  });
  if(!isOpen){
    item.classList.add('open');
    a.style.maxHeight = a.scrollHeight + 'px';
  }
});
</script>
</body>
</html>

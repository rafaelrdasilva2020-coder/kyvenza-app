<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KYVENZA | Início</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="icon" href="assets/icons/favicon.ico"/>
<link rel="apple-touch-icon" href="assets/icons/icon-180.png"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/kyvenza.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen pb-24">

  <!-- Header -->
  <header class="flex items-center justify-between px-5 py-4 border-b border-white/5">
    <div class="flex items-center gap-2">
      <img src="assets/logo.png" class="w-8 h-8 rounded-full"/>
      <span class="font-display font-bold text-lg gradient-text">KYVENZA</span>
    </div>
    <button onclick="sair()" class="text-xs font-mono text-[#8b9284] border border-[rgba(255,255,255,0.1)] rounded-full px-3 py-1">SAIR</button>
  </header>

  <main class="px-5 pt-6 space-y-6">
    <div>
      <h1 class="font-display text-2xl font-bold" id="saudacao">Olá</h1>
      <p class="text-sm text-[#8b9284] mt-1" id="subtitulo">Carregando seu status...</p>
    </div>

    <!-- Card de status do mês -->
    <section id="card-status" class="card-destaque p-5">
      <div id="conteudo-status" class="text-sm text-[#8b9284]">Carregando...</div>
    </section>

    <!-- Histórico -->
    <section>
      <h2 class="font-display font-semibold text-lg mb-3">Treinos anteriores</h2>
      <div id="lista-historico" class="space-y-3">
        <p class="text-sm text-[#8b9284] font-mono">Nenhum treino anterior ainda.</p>
      </div>
    </section>
  </main>

  <!-- Nav inferior -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#131313] border-t border-white/5 flex justify-around py-3">
    <a href="home.html" class="flex flex-col items-center text-[#76ff03] text-xs font-mono">
      <span>●</span>HOME
    </a>
    <a href="questionario.html" class="flex flex-col items-center text-[#8b9284] text-xs font-mono">
      <span>●</span>AI TRAINER
    </a>
    <a href="treino.html" class="flex flex-col items-center text-[#8b9284] text-xs font-mono">
      <span>●</span>TREINO
    </a>
    <a href="evolucao.html" class="flex flex-col items-center text-[#8b9284] text-xs font-mono">
      <span>●</span>EVOLUÇÃO
    </a>
  </nav>

<script src="js/supabase-client.js"></script>
<script>
  (async () => {
    const aluno = await protegerPaginaDoAluno();
    if (!aluno) return;

    document.getElementById("saudacao").textContent = `Olá, ${aluno.nome.split(" ")[0]}`;

    const hoje = new Date();
    const mesReferencia = new Date(Date.UTC(hoje.getUTCFullYear(), hoje.getUTCMonth(), 1)).toISOString().slice(0, 10);

    const { data: treinoDoMes } = await supabaseClient
      .from("treinos")
      .select("id, nome, foco, criado_em")
      .eq("aluno_id", aluno.id)
      .eq("mes_referencia", mesReferencia)
      .maybeSingle();

    const statusEl = document.getElementById("conteudo-status");
    const subtitulo = document.getElementById("subtitulo");

    if (treinoDoMes) {
      subtitulo.textContent = "Seu treino deste mês já está pronto.";
      statusEl.innerHTML = `
        <p class="label-mono mb-1" style="color:#76ff03">TREINO ATIVO</p>
        <h3 class="font-display text-xl font-bold mb-1">${treinoDoMes.nome}</h3>
        <p class="text-sm text-[#8b9284] mb-4">${treinoDoMes.foco || ""}</p>
        <a href="treino.html" class="btn-primary font-display font-semibold py-2.5 px-5 rounded-lg inline-block">VER TREINO</a>
      `;
    } else {
      subtitulo.textContent = "Você ainda não gerou seu treino deste mês.";
      statusEl.innerHTML = `
        <p class="label-mono mb-1" style="color:#00daf3">DISPONÍVEL</p>
        <h3 class="font-display text-xl font-bold mb-1">Gere seu treino de ${hoje.toLocaleDateString("pt-BR", { month: "long" })}</h3>
        <p class="text-sm text-[#8b9284] mb-4">Responda 4 perguntas rápidas e a IA monta seu treino personalizado.</p>
        <a href="questionario.html" class="gradient-cta-hero font-display font-semibold py-2.5 px-5 rounded-lg inline-block">GERAR TREINO</a>
      `;
    }

    // Histórico (últimos treinos, excluindo o do mês atual)
    const { data: historico } = await supabaseClient
      .from("treinos")
      .select("id, nome, foco, criado_em")
      .eq("aluno_id", aluno.id)
      .neq("mes_referencia", mesReferencia)
      .order("criado_em", { ascending: false })
      .limit(6);

    if (historico && historico.length > 0) {
      document.getElementById("lista-historico").innerHTML = historico.map(t => `
        <div class="glass-card rounded-lg p-4 flex items-center justify-between">
          <div>
            <p class="font-display font-semibold">${t.nome}</p>
            <p class="text-xs text-[#8b9284] font-mono">${new Date(t.criado_em).toLocaleDateString("pt-BR")}</p>
          </div>
        </div>
      `).join("");
    }
  })();
</script>
</body>
</html>
